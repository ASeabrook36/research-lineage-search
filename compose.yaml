name: euv-research
services:
  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:0bd6dbab98295718c85399ad27c38d45733060086528711594a7d52bafcb3447
    environment:
      ENABLE_TELEMETRY: "false"
      GATEWAY_PUBLIC_ENDPOINT: cosmos
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:1234:1234"
    volumes:
      - cosmos-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
  app:
    build: .
    environment:
      COSMOS_ENDPOINT: http://cosmos:8081
      DATA_DIR: /data
      HF_HOME: /data/models
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./.local:/data
      - ./research:/app/research:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data:ro
      - ./pytest.ini:/app/pytest.ini:ro
    depends_on:
      cosmos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/api/status',timeout=10))['ready']"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - access
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/status"]
      interval: 30s
      timeout: 15s
      retries: 3
volumes:
  cosmos-data:
networks:
  default:
  access:
